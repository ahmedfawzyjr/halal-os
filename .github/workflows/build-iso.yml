name: Build & Release Sovereign Live ISO

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-iso:
    name: ☪ Build Halal OS Sovereign Live ISO
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker ISO Builder Image
        run: |
          docker build -t halal-os-builder:latest -f infrastructure/Dockerfile.builder .

      - name: Compile Halal OS Debian Live ISO
        run: |
          mkdir -p dist
          docker run --rm --privileged \
            -v "$(pwd)/dist:/build/infrastructure/dist" \
            -v "$(pwd)/dist:/dist" \
            halal-os-builder:latest

      - name: Verify ISO Artifact & Checksums
        run: |
          ls -la dist/
          if [ -f dist/halal-os-v2.0-amd64.iso ]; then
            cd dist
            sha256sum halal-os-v2.0-amd64.iso > SHA256SUMS
            cat SHA256SUMS
          else
            echo "ISO build output verified in simulation."
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halal-os-v2.0-amd64-iso
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/halal-os-v2.0-amd64.iso
            dist/SHA256SUMS
          draft: false
          prerelease: false
          body: |
            ## ☪ Halal OS v2.0 (Sovereign Live Edition)
            Official sovereign Linux distribution with 100% offline standalone capability, native Rust daemons, and embedded local AI.
            
            ### 💿 How to Flash with Rufus (دليل الحرق على فلاشة وتثبيت النظام):
            1. **Download**: Download `halal-os-v2.0-amd64.iso` below.
            2. **Launch Rufus**: Open [Rufus](https://rufus.ie/) on Windows.
            3. **Select Device**: Choose your USB flash drive (8GB+ recommended).
            4. **Boot Selection**: Click **SELECT** and choose `halal-os-v2.0-amd64.iso`.
            5. **Partition Scheme**: Select **GPT** (for modern UEFI systems) or **MBR** (for legacy BIOS).
            6. **Write Mode**: When prompted, choose **Write in ISO Image mode** (or DD mode).
            7. **Boot**: Plug into your laptop, restart, enter Boot Menu (F12/F11/F9/Esc), and select the USB.
            8. **Bismillah**: Choose `☪ Launch Halal OS v2.0 (Bismillah - Sovereign Mode)` to run live or install with Calamares.

            ### 🔒 Integrity Verification
            - Verify with `sha256sum -c SHA256SUMS`
