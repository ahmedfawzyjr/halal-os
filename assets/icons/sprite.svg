<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Crescent & Star (Hilal) -->
    <symbol id="icon-crescent-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" />
      <path d="M19 5l.7 1.5L21.3 7l-1.3 1.2.3 1.8-1.3-.8-1.3.8.3-1.8L16.7 7l1.6-.5L19 5z" fill="currentColor" stroke="none" />
    </symbol>

    <!-- Qibla Kaaba Compass -->
    <symbol id="icon-kaaba-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <!-- North Pointer (Gold) -->
      <polygon points="12,3 15,11 12,9 9,11" fill="currentColor" />
      <!-- South Pointer -->
      <polygon points="12,21 9,13 12,15 15,13" fill="none" />
      <!-- Kaaba Cube Center Symbol -->
      <rect x="10" y="10" width="4" height="4" fill="currentColor" />
    </symbol>

    <!-- Holy Quran Book -->
    <symbol id="icon-quran-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
      <!-- Arabesque Spine & Rosette -->
      <line x1="12" y1="6" x2="16" y2="6" />
      <line x1="12" y1="10" x2="16" y2="10" />
      <circle cx="9" cy="8" r="1.5" fill="currentColor" />
    </symbol>

    <!-- Zakat Balanced Scales -->
    <symbol id="icon-zakat-scales" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="3" x2="12" y2="21" />
      <path d="M5 21h14" />
      <path d="M4 7h16" />
      <!-- Left Scale Pan -->
      <path d="M4 7l-2 5h6l-2-5" />
      <path d="M2 12a3 3 0 0 0 6 0" />
      <!-- Right Scale Pan -->
      <path d="M20 7l-2 5h6l-2-5" />
      <path d="M18 12a3 3 0 0 0 6 0" />
    </symbol>

    <!-- Halal Sovereign Shield -->
    <symbol id="icon-shield-halal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      <!-- 8-Point Star Emblem -->
      <polygon points="12,7 13.2,9.8 16,11 13.2,12.2 12,15 10.8,12.2 8,11 10.8,9.8" fill="currentColor" stroke="none" />
    </symbol>

    <!-- Amina AI Sovereign Sparkle -->
    <symbol id="icon-ai-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4L12 2z" fill="currentColor" />
      <path d="M19 15l1 2.2L22.2 18 20 19l-1 2.2L18 19l-2.2-1 2.2-.8L19 15z" />
      <circle cx="5" cy="19" r="1.5" fill="currentColor" />
    </symbol>

    <!-- Sovereign Mesh Cloud -->
    <symbol id="icon-mesh-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
      <!-- P2P Mesh Nodes -->
      <circle cx="8" cy="14" r="1" fill="currentColor" />
      <circle cx="12" cy="11" r="1" fill="currentColor" />
      <circle cx="16" cy="14" r="1" fill="currentColor" />
      <line x1="8" y1="14" x2="12" y2="11" stroke-width="1.2" stroke-dasharray="2 1" />
      <line x1="12" y1="11" x2="16" y2="14" stroke-width="1.2" stroke-dasharray="2 1" />
    </symbol>

    <!-- Halal App Store Package Cart -->
    <symbol id="icon-store-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="21" r="1" />
      <circle cx="19" cy="21" r="1" />
      <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
      <!-- Halal Verified Check inside Cart -->
      <path d="M11 9l2 2 4-4" stroke-width="1.8" />
    </symbol>
  </defs>
</svg>
