<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0f4534" />
      <stop offset="45%" stop-color="#09291f" />
      <stop offset="85%" stop-color="#04140f" />
      <stop offset="100%" stop-color="#020a07" />
    </radialGradient>
    
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae084" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#aa820a" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="emeraldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fe0a0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b5e43" stop-opacity="0.1" />
    </linearGradient>

    <!-- Islamic 8-Point Star Pattern Definition -->
    <pattern id="islamicGrid" width="240" height="240" patternUnits="userSpaceOnUse">
      <path d="M120 20 L150 70 L200 70 L165 110 L185 160 L135 135 L120 185 L105 135 L55 160 L75 110 L40 70 L90 70 Z" 
            fill="none" stroke="url(#goldStroke)" stroke-width="1.2" opacity="0.4" />
      <circle cx="120" cy="120" r="95" fill="none" stroke="url(#emeraldStroke)" stroke-width="1" opacity="0.3" />
      <circle cx="120" cy="120" r="40" fill="none" stroke="url(#goldStroke)" stroke-width="0.8" opacity="0.25" />
      <rect x="35" y="35" width="170" height="170" fill="none" stroke="url(#emeraldStroke)" stroke-width="0.75" transform="rotate(45 120 120)" opacity="0.2" />
      <rect x="35" y="35" width="170" height="170" fill="none" stroke="url(#goldStroke)" stroke-width="0.75" opacity="0.15" />
    </pattern>

    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Deep Emerald Canvas -->
  <rect width="3840" height="2160" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="1920" cy="950" r="900" fill="url(#goldGlow)" filter="url(#subtleBlur)" />
  <circle cx="960" cy="600" r="600" fill="#0d523d" opacity="0.2" filter="url(#subtleBlur)" />
  <circle cx="2880" cy="1300" r="700" fill="#094231" opacity="0.25" filter="url(#subtleBlur)" />

  <!-- Full Geometric Mesh Overlay -->
  <rect width="3840" height="2160" fill="url(#islamicGrid)" />

  <!-- Central Arabesque Rosette Feature -->
  <g transform="translate(1920, 950)" opacity="0.85">
    <!-- Outer concentric star polygon rings -->
    <circle cx="0" cy="0" r="420" fill="none" stroke="url(#goldStroke)" stroke-width="2" />
    <circle cx="0" cy="0" r="380" fill="none" stroke="url(#emeraldStroke)" stroke-width="1.5" stroke-dasharray="6,6" />
    
    <!-- 16-point Geometrical Star -->
    <g id="star16">
      <path d="M0 -350 L75 -200 L247 -247 L200 -75 L350 0 L200 75 L247 247 L75 200 L0 350 L-75 200 L-247 247 L-200 75 L-350 0 L-200 -75 L-247 -247 L-75 -200 Z" 
            fill="none" stroke="url(#goldStroke)" stroke-width="2.5" />
      <path d="M0 -350 L75 -200 L247 -247 L200 -75 L350 0 L200 75 L247 247 L75 200 L0 350 L-75 200 L-247 247 L-200 75 L-350 0 L-200 -75 L-247 -247 L-75 -200 Z" 
            fill="none" stroke="url(#emeraldStroke)" stroke-width="1.5" transform="rotate(22.5)" />
    </g>

    <!-- Inner Rosette -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#goldStroke)" stroke-width="2" />
    <circle cx="0" cy="0" r="140" fill="#0d4734" fill-opacity="0.4" stroke="url(#goldStroke)" stroke-width="1.5" />
    
    <!-- Elegant Crescent & Star -->
    <path d="M20 -60 A65 65 0 1 0 70 50 A52 52 0 1 1 20 -60 Z" fill="#fae084" opacity="0.9" />
    <path d="M60 -35 L68 -15 L88 -15 L72 0 L78 20 L60 8 L42 20 L48 0 L32 -15 L52 -15 Z" fill="#fae084" opacity="0.95" />
  </g>

  <!-- Typography Watermark -->
  <g transform="translate(1920, 1600)" text-anchor="middle" opacity="0.5">
    <text font-family="'Amiri', 'Traditional Arabic', serif" font-size="52" fill="#d4af37" letter-spacing="4">نظام حلال • HALAL OS</text>
    <text font-family="'Cinzel', 'Outfit', sans-serif" font-size="20" fill="#8edebb" letter-spacing="10" y="55">SOVEREIGN ISLAMIC WORKSTATION</text>
  </g>
</svg>
